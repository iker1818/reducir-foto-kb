<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dividir PDF</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page container stack">
    <div><h1 class="page__title">Dividir PDF</h1><p class="page__lead">Extrae páginas concretas o rangos.</p></div>
    <section class="card stack" aria-label="Dividir PDF">
      <input id="file-input" type="file" accept="application/pdf,.pdf" class="hidden">
      <button id="choose-file" class="btn btn--primary" type="button">Elegir PDF</button>
      <p id="page-info" class="msg"></p>
      <label class="field">Páginas o rangos (ej. 1-3,5,8)<input id="pages" class="input input--full" type="text" placeholder="1-3,5"></label>
      <div class="button-row"><button id="extract" class="btn btn--primary" type="button" disabled>Extraer y descargar</button></div>
      <p id="message" class="msg" role="status"></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container site-footer__inner"><nav aria-label="Todas las herramientas"><ul class="site-footer__links"><li><a href="../herramientas.html" data-i18n="common.allTools">Todas las herramientas</a></li></ul></nav></div></footer>
  <script src="../js/i18n.js"></script>
  <script src="../js/nav.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../js/dividir-pdf.js"></script>
</body>
</html>
