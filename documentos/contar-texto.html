<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contar palabras y caracteres</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page container stack">
    <div><h1 class="page__title">Contar palabras y caracteres</h1><p class="page__lead">Análisis de texto en tiempo real.</p></div>
    <section class="card stack" aria-label="Contador de texto">
      <textarea id="text-input" class="text-area" aria-label="Texto para contar" placeholder="Escribe o pega aquí tu texto"></textarea>
      <div class="stat-grid">
        <div class="stat"><strong id="words">0</strong><span>Palabras</span></div>
        <div class="stat"><strong id="chars">0</strong><span>Caracteres</span></div>
        <div class="stat"><strong id="chars-no-spaces">0</strong><span>Sin espacios</span></div>
        <div class="stat"><strong id="lines">0</strong><span>Líneas</span></div>
        <div class="stat"><strong id="reading">0 min</strong><span>Lectura estimada</span></div>
      </div>
      <div class="button-row"><button id="copy" class="btn btn--ghost" type="button">Copiar texto</button><button id="clear" class="btn btn--ghost" type="button">Limpiar</button></div>
      <p id="message" class="msg" role="status"></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container site-footer__inner"><nav aria-label="Todas las herramientas"><ul class="site-footer__links"><li><a href="../herramientas.html" data-i18n="common.allTools">Todas las herramientas</a></li></ul></nav></div></footer>
  <script src="../js/i18n.js"></script>
  <script src="../js/nav.js"></script><script src="../js/contar-texto.js"></script>
</body>
</html>
