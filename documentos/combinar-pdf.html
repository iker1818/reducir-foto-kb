<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combinar archivos PDF</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page container stack">
    <div><h1 class="page__title">Combinar PDF</h1><p class="page__lead">Une varios PDF y ajusta su orden.</p></div>
    <section class="card stack" aria-label="Combinar PDF">
      <input id="file-input" type="file" accept="application/pdf,.pdf" multiple class="hidden">
      <button id="choose-file" class="btn btn--primary" type="button">Añadir PDF</button>
      <div id="file-list" class="tool-layout" aria-live="polite"></div>
      <div class="button-row"><button id="merge" class="btn btn--primary" type="button" disabled>Combinar y descargar</button><button id="clear" class="btn btn--ghost" type="button" disabled>Quitar todos</button></div>
      <p id="message" class="msg" role="status"></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container site-footer__inner"><nav aria-label="Todas las herramientas"><ul class="site-footer__links"><li><a href="../herramientas.html" data-i18n="common.allTools">Todas las herramientas</a></li></ul></nav></div></footer>
  <script src="../js/i18n.js"></script>
  <script src="../js/nav.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../js/combinar-pdf.js"></script>
</body>
</html>
