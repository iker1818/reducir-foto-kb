<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="seo.photoFormatTitle">Cambiar formato de foto online gratis | hazlofacil-tools</title>
  <meta name="description" content="Convierte fotos entre JPG, PNG y WebP para usar el formato que necesitas." data-i18n-content="seo.photoFormatDescription">
  <meta property="og:title" content="Cambiar formato de foto online gratis | hazlofacil-tools" data-i18n-content="seo.photoFormatTitle">
  <meta property="og:description" content="Convierte fotos entre JPG, PNG y WebP para usar el formato que necesitas." data-i18n-content="seo.photoFormatDescription">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hazlofacil-tools.netlify.app/fotos/cambiar-formato.html">
  <meta property="og:image" content="https://hazlofacil-tools.netlify.app/img/Gemini_Generated_Image_z8re8yz8re8yz8re.jfif">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page container stack">
    <div><h1 class="page__title">Cambiar formato de fotos</h1><p class="page__lead">Convierte imágenes a JPG, PNG o WebP.</p></div>
    <section class="card stack" aria-label="Convertir formato de imagen">
      <input id="file-input" type="file" accept="image/*" class="hidden">
      <button id="choose-file" class="btn btn--primary" type="button">Elegir imagen</button>
      <div class="control-grid">
        <label class="field">Formato<select id="format" class="input input--full"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
        <label id="quality-field" class="field">Calidad<div class="range-wrap"><input id="quality" type="range" min="50" max="100" value="92"><output id="quality-value">92%</output></div></label>
      </div>
      <div id="preview" class="work-preview"><p class="msg">Sin imagen seleccionada.</p></div>
      <p id="message" class="msg" role="status"></p>
      <button id="download" class="btn btn--primary" type="button" disabled>Descargar resultado</button>
    </section>
    <p class="tool-summary" data-i18n="summary.photoFormat">Cambia el formato de una foto cuando una web o aplicación no acepta el original.</p>
  </main>
  <footer class="site-footer"><div class="container site-footer__inner"><nav aria-label="Todas las herramientas"><ul class="site-footer__links"><li><a href="../herramientas.html" data-i18n="common.allTools">Todas las herramientas</a></li></ul></nav></div></footer>
  <script src="../js/i18n.js"></script>
  <script src="../js/nav.js"></script><script src="../js/cambiar-formato.js"></script>
</body>
</html>
